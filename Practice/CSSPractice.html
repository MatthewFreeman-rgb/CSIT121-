<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Practice</title>

    <style>
        body {
            background-color: #eaeaea;
            color: #000033;
            font-family: Arial, Verdana, sans-serif;
        }

        h1 {
            color: brown;
            font-size: 2em;
            font-family: Arial, Verdana, sans-serif;
        }

        .green-paragraph {
            background-color: green;
            color: white;
            padding: 10px;
        }

        ul {
            background-color: #dcdcdc;
            padding: 15px;
            border-radius: 8px;
        }

        li {
            margin-bottom: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Ugly CSS Text and Color Playground</h1>

    <p class="green-paragraph">
        This is my first paragraph for the hands-on activity.
    </p>

    <p style="color: blue; text-indent: 2em;">
        This is my second paragraph with inline styling.
    </p>

    <ul>
        <li>Intro to CSS (video)</li>
        <li>Using CSS with external style sheets</li>
        <li>CSS Background</li>
    </ul>

</body>
</html>
