<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
    <a href="tierlist.html">Tier List</a>
    <a href="contact.html">Contact</a>
</nav>

<h1>Give Your Opinion</h1>

<form>

<label for="name">Name:</label>
<input type="text" id="name" name="name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>

<label for="favorite">Favorite Player:</label>
<input type="text" id="favorite" name="favorite">

<label>Best Tier:</label>
<input type="radio" name="tier" value="S"> S
<input type="radio" name="tier" value="A"> A
<input type="radio" name="tier" value="B"> B

<label>What do you like?</label>
<input type="checkbox" name="like" value="power"> Power
<input type="checkbox" name="like" value="speed"> Speed

<label for="team">Favorite Team:</label>
<select id="team" name="team">
    <option>Yankees</option>
    <option>Dodgers</option>
    <option>Braves</option>
</select>

<label for="comments">Comments:</label>
<textarea id="comments" name="comments"></textarea>

<input type="submit" value="Submit">

</form>

</body>
</html>
